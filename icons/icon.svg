<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Flask Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)" />
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.35)" />
    </linearGradient>

    <!-- Liquid Layer Gradients -->
    <linearGradient id="liquidCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="liquidPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="liquidGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="liquidEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="flaskClip">
      <path d="M 230 110 L 282 110 L 282 190 L 395 385 A 35 35 0 0 1 365 435 L 147 435 A 35 35 0 0 1 117 385 L 230 190 Z" />
    </clipPath>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.35" />

  <!-- Ambient Glow Behind Flask -->
  <circle cx="256" cy="320" r="140" fill="#0284c7" opacity="0.25" filter="url(#glow)" />
  <circle cx="256" cy="380" r="100" fill="#ec4899" opacity="0.2" filter="url(#glow)" />

  <!-- Sparkles -->
  <g fill="#fde047" opacity="0.85">
    <path d="M 120 140 Q 120 160 100 160 Q 120 160 120 180 Q 120 160 140 160 Q 120 160 120 140 Z" />
    <path d="M 390 120 Q 390 135 375 135 Q 390 135 390 150 Q 390 135 405 135 Q 390 135 390 120 Z" transform="scale(0.8) translate(70, 20)" />
    <circle cx="395" cy="240" r="6" fill="#38bdf8" opacity="0.75" />
    <circle cx="115" cy="310" r="5" fill="#a855f7" opacity="0.75" />
  </g>

  <!-- Flask Liquid Contents (Clipped to Flask Shape) -->
  <g clip-path="url(#flaskClip)">
    <!-- Layer 1 (Bottom): Emerald Glow -->
    <rect x="90" y="380" width="332" height="60" fill="url(#liquidEmerald)" />
    <!-- Layer 2: Gold Elixir -->
    <rect x="90" y="325" width="332" height="55" fill="url(#liquidGold)" />
    <!-- Layer 3: Purple Chameleon -->
    <rect x="90" y="270" width="332" height="55" fill="url(#liquidPurple)" />
    <!-- Layer 4: Cyan Magic -->
    <rect x="90" y="215" width="332" height="55" fill="url(#liquidCyan)" />
    
    <!-- Liquid Wave Surface -->
    <path d="M 170 215 Q 210 205 256 215 Q 300 225 342 215 L 342 230 L 170 230 Z" fill="#67e8f9" opacity="0.6" />

    <!-- Rising Bubbles in Liquid -->
    <circle cx="230" cy="395" r="9" fill="rgba(255,255,255,0.6)" />
    <circle cx="280" cy="340" r="7" fill="rgba(255,255,255,0.7)" />
    <circle cx="215" cy="290" r="10" fill="rgba(255,255,255,0.65)" />
    <circle cx="270" cy="240" r="8" fill="rgba(255,255,255,0.8)" />
  </g>

  <!-- Glass Flask Body & Outline -->
  <path d="M 230 110 L 282 110 L 282 190 L 395 385 A 35 35 0 0 1 365 435 L 147 435 A 35 35 0 0 1 117 385 L 230 190 Z" 
        fill="url(#glassGrad)" 
        stroke="rgba(255, 255, 255, 0.85)" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Flask Lip / Neck Ring -->
  <rect x="214" y="96" width="84" height="20" rx="8" fill="#e2e8f0" stroke="rgba(255,255,255,0.9)" stroke-width="4" />

  <!-- Glass Reflection Highlights -->
  <path d="M 242 130 L 242 185 L 155 370 A 25 25 0 0 0 165 415" 
        stroke="rgba(255, 255, 255, 0.75)" 
        stroke-width="7" 
        stroke-linecap="round" 
        fill="none" />

  <path d="M 270 130 L 270 180" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="4" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Deluxe Gold Ribbon / Badge at Bottom -->
  <g transform="translate(146, 440)">
    <rect x="0" y="0" width="220" height="42" rx="21" fill="linear-gradient(90deg, #d97706, #f59e0b, #fbbf24, #d97706)" stroke="#fef08a" stroke-width="2.5" />
    <text x="110" y="27" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="4">DELUXE</text>
  </g>
</svg>
